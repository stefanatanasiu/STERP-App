* STERP COBOL dialect map - one line per source folder: <module> = <cobc -std value>
* Online, batch and test programs of a module are compiled with the same dialect.
* Dialect reflects the era in which the module was (notionally) first written:
*   common  GnuCOBOL default  - shared services, rewritten 2012
*   fin     Micro Focus        - General Ledger, Micro Focus COBOL/2 on OS/2 (1994)
*   ar      IBM Enterprise     - Sales Ledger ported from MVS (1991)
*   ap      IBM Enterprise     - Purchase Ledger ported from MVS (1991)
*   so      ACUCOBOL-GT        - Distribution suite (1998)
*   po      ACUCOBOL-GT        - Distribution suite (1998)
*   itm     RM/COBOL           - Stock control (1996)
*   cst     RM/COBOL           - Costing (1997)
*   bom     GnuCOBOL default   - Engineering rewrite, free format (2014)
*   kit     GnuCOBOL default   - Kitting rewrite, free format (2016)
*   xmd     IBM MVS            - Batch reporting / reconciliation (1993)
*   tui     GnuCOBOL default   - Operator console (2008)
common=default
fin=mf
ar=ibm
ap=ibm
so=acu
po=acu
itm=rm
cst=rm
bom=default
kit=default
xmd=mvs
tui=default
